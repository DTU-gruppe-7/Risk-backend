version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # EF Core-pakker og dotnet-ef-værktøjet skal altid have samme version
      efcore:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql.EntityFrameworkCore*", "dotnet-ef"]
      aspnetcore:
        patterns: ["Microsoft.AspNetCore*", "Microsoft.Extensions*"]
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*", "Testcontainers*"]
    ignore:
      # Microsoft.AspNetCore.OpenApi 10 kræver Microsoft.OpenApi 2.x
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      # Projektet kører .NET 10: major-versioner af disse pakker følger .NET (11.x kræver .NET 11).
      # Opgraderes samlet sammen med TargetFramework, ikke af Dependabot.
      - dependency-name: "Microsoft.AspNetCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    # Dagligt: base-images genbygges med sikkerhedsrettelser, og Trivy i CI fejler på dem
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # init og analyze skal have samme version, ellers fejler CodeQL-jobbene
      codeql:
        patterns: ["github/codeql-action*"]
