services:
  db:
    image: postgres:17-alpine
    container_name: risk-postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB mangler i miljøet eller .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER mangler i miljøet eller .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mangler i miljøet eller .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-RiskDB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - risk-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risk-api-server
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY:?JWT_KEY mangler i miljøet eller .env}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - risk-network

volumes:
  pgdata:

networks:
  risk-network:
    driver: bridge
